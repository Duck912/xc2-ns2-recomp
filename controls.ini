# Xenoblade Chronicles 2 (Switch 2 Edition), play mode: controls and display.

[meta]
defaults_rev = 0

[mouse]
yaw = 0.000767945
pitch = 0.000767945
alt_camera = 1
alt_sensitivity = 2.00000034
invert_y = 0
invert_x = 0
menu_cursor = 1
wheel_cycles = 1

[aim]
lock_mode = classic
free_lock_margin = 0.15

[camera]
gun_drives_view = 1

[tweaks]
skip_intro = 0
skip_boot_logos = 0
fast_menus = 0
menu_speed = 2
language = auto
glow_color = off
suit_glow = auto
ball_glow = auto
gun_glow = auto
suit_color = off
gun_color = off

[pad]
label_abxy = 1
deadzone = 0.1
right_deadzone = 0.1
invert_y = 0
look_sens = 1
trigger_threshold = 0.35
stick_max = 1
gyro = 1
gyro_scale = 1
rumble = 1
rumble_scale = 1
alt_orbit = 2

[padmap]
south = default
east = default
west = default
north = default
left_shoulder = default
right_shoulder = default
left_trigger = default
right_trigger = default
start = default
back = default
left_stick = default
right_stick = default
dpad_up = default
dpad_down = default
dpad_left = default
dpad_right = default

[timing]
tap_ms = 200
hold_ms = 250
double_ms = 300
pulse_ms = 80

[display]
window_mode = windowed
; FIFO is the default the launcher shows, and a mode picked there ([gfx] present_mode in nxrt.ini) wins over this key.
vsync = 1
fps_limit = 60
width = 1280
height = 720
keep_aspect = 1
render_scale = 100
render_width = 0
render_height = 0
aspect = auto
fov_offset = 0
dynamic_resolution = 0
anisotropy = 0
lod_bias = 0
bloom = 1
chromatic_aberration = 1
quality_preset = switch2
view_distance = 1
fast_gpu_memory = 1
fewer_gpu_waits = 1
shader_prewarm = 1
astc_quality = high
monitor = auto

[audio]
volume = 1
mute_unfocused = 0
device = default

[hdr]
mode = auto
format = auto
peak_nits = 0
paper_white_nits = 0
highlight_boost = 1

[upscale]
mode = off
quality = quality
sharpness = 0.8
scene_scale = 100
fsr_dll = 
dlss_dll = 
xess_dll = 
frame_generation = 0

[latency]
mode = off
frames_ahead = 1
log_timings = 0

[picture]
contrast = 1
saturation = 1
black = 0
gamma = 1

[prompts]
style = auto

[fps]
show = 0
key = F2
corner = top_left
detail = 1
in_screenshots = 0

[switch]
move_forward = LS_UP
move_back = LS_DOWN
move_left = LS_LEFT
move_right = LS_RIGHT
look_up = RS_UP
look_down = RS_DOWN
look_left = RS_LEFT
look_right = RS_RIGHT
primary = none
target = none
secondary = none
jump = none
alt_form = none
look_hold = none
map = none
pause = none
confirm = A
back = B
dpad_up = UP
dpad_down = DOWN
dpad_left = LEFT
dpad_right = RIGHT
set_a_1 = none
set_a_2 = none
set_a_3 = none
set_a_4 = none
set_b_1 = none
set_b_2 = none
set_b_3 = none
set_b_4 = none
set_a_next = none
set_a_prev = none
btn_a = A
btn_b = B
btn_x = X
btn_y = Y
btn_l = L
btn_r = R
btn_zl = ZL
btn_zr = ZR
btn_plus = PLUS
btn_minus = MINUS
btn_lstick = LSTICK
btn_rstick = RSTICK
mouse_mode = none

[bindings.all]

[bindings.play]

[bindings.alt]

[bindings.map]

[bindings.menu]

[bindings.inspect]
