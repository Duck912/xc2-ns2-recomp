# dev: the 3.0.1 development build. Everything the launcher used to set in 30 lines of a .cmd file.
[run]
exe = xc2/build/301/boot/xc2_boot.exe
cwd = xc2/build/boot
gfx = window
link = host
exefs = xc2/game/xc2ns301
romfs = xc2/build/boot/game/romfs-301
dlc = xc2/build/boot/game/dlc-301
save = work/save-301
shader_cache = xc2/build/boot/shader_cache/spirv
missing = work/missing-301
logs = work/logs
fps = 60
hz = 60

[env]
XC2_301_BOOTPARAM = 1
XC2_301_VAMM = 1
XC2_301_OPUS = 1
XC2_301_AUDIO = 1
NXRT_MEMORY_LIMIT_GB = 24
NXRT_PROCESS_SYSTEM_RESOURCE_SIZE = 0x6000000
NXRT_TITLE_DISPLAY_VERSION = 3.0.1
NXRT_IPC_STUB_RESULT = 0
NXRT_NVN_FRONT_FACE_MODE = 2
NXRT_NVN_QUAD_SPLIT = 16
NXRT_NVN_EARLYZ_FS = auto
NXRT_NVN_EARLYZ_MASK = 1
NXRT_NVN_DS_DEBUG = 1
NXRT_SYSTEM_LANGUAGE = zh-Hans
NXRT_TITLE_SUPPORTED_LANGUAGES = Japanese,AmericanEnglish,BritishEnglish,French,German,Italian,Spanish,LatinAmericanSpanish,Chinese,Taiwanese,Korean,SimplifiedChinese,TraditionalChinese
