# n2den: the 3.0.1 build on n2den's NVN-HLE renderer (--nvn n2den, boot exe linked with -N2denDist).
[run]
exe = xc2/build/301/boot-n2den/xc2_boot.exe
cwd = xc2/build/boot
gfx = window
link = host
exefs = xc2/game/xc2ns301
romfs = xc2/build/boot/game/romfs-301
dlc = xc2/build/boot/game/dlc-301
save = work/save-301
shader_cache = xc2/build/boot/shader_cache/spirv
missing = work/missing-301
logs = work/logs
fps = 60
hz = 60

[env]
NXRT_NVN_DS_DEBUG = 1
NXRT_SYSTEM_LANGUAGE = en-US
NXRT_NVN_BACKEND = n2den
