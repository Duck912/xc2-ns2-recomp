# xcde: Xenoblade Chronicles: Definitive Edition - Nintendo Switch 2 Edition (2.0.0) on n2den's NVN-HLE renderer.
# The boot exe is xc2_boot linked with XC:DE's main.lib (tools\build\build-boot.ps1 -MainLib xcde\build\200\lib\main.lib
# -N2denDist ...), run with --game xcde (XC2_GAME) and --nvn n2den (NXRT_NVN_BACKEND).
# romfs = program 0's RomFS (the Switch 2 program reads its data from there); dlc = <dlc>\0100ff500e34b001\romfs.
[run]
setup = tools/setup/xcde_setup.py
exe = xcde/build/200/boot-n2den/xc2_boot.exe
cwd = xcde/build/200/boot-n2den
gfx = window
link = host
exefs = xcde/game/xcde200
romfs = xcde/build/200/game/romfs
dlc = xcde/build/200/game/dlc
save = work/save-xcde
shader_cache = xcde/build/200/shader_cache
missing = work/missing-xcde
logs = work/logs
fps = 60
hz = 60

[env]
NXRT_SYSTEM_LANGUAGE = en-US
NXRT_NVN_BACKEND = n2den
XC2_GAME = xcde
# tools\setup\xcde_setup.py GAME_ENV ([run] setup) already carries these; repeated so an older play.ps1, which reads
# xc2_setup.py, still starts XC:DE. The display version must be 2.0.0: the game compares it with the upgrade pack's
# dlcver.bin ("2.0.0") and otherwise shows nn::err::ShowUnacceptableAddOnContentForUpgradeVersionError (2162-0102).
NXRT_TITLE_DISPLAY_VERSION = 2.0.0
NXRT_TITLE_SUPPORTED_LANGUAGES = AmericanEnglish,BritishEnglish,Japanese,French,German,LatinAmericanSpanish,Spanish,Italian,CanadianFrench,Korean,TraditionalChinese,SimplifiedChinese,Chinese,Taiwanese
