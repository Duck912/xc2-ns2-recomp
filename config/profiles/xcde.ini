# xcde: Xenoblade Chronicles: Definitive Edition - Nintendo Switch 2 Edition (2.0.0) on n2den's NVN-HLE renderer.
# The boot exe is xc2_boot linked with XC:DE's main.lib (tools\build\build-boot.ps1 -MainLib xcde\build\200\lib\main.lib
# -N2denDist ...), run with --game xcde (XC2_GAME) and --nvn n2den (NXRT_NVN_BACKEND).
# romfs = program 0's RomFS (the Switch 2 program reads its data from there); dlc = <dlc>\0100ff500e34b001\romfs.
[run]
exe = xcde/build/200/boot-n2den/xc2_boot.exe
cwd = xcde/build/200/boot-n2den
gfx = window
link = host
exefs = xcde/game/xcde200
romfs = xcde/build/200/game/romfs
dlc = xcde/build/200/game/dlc
save = work/save-xcde
shader_cache = xcde/build/200/shader_cache
missing = work/missing-xcde
logs = work/logs
fps = 60
hz = 60

[env]
NXRT_SYSTEM_LANGUAGE = en-US
NXRT_NVN_BACKEND = n2den
XC2_GAME = xcde
