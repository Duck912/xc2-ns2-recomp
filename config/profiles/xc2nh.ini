# xc2nh: Xenoblade Chronicles 2 - Nintendo Switch 2 Edition (3.0.1) on NVN-HLE, as tools\setup\xc2_nvnhle_setup.py
# builds it: the boot exe (xc2.exe; the boot program is xc2/src/xc2_boot.cpp) linked with -N2denDist and run with
# --nvn n2den (NXRT_NVN_BACKEND). romfs = the Switch 2 program's RomFS (bf2.ard ...); dlc = <dlc>\<add-on id>\romfs.
[run]
setup = tools/setup/xc2_nvnhle_setup.py
exe = xc2/build/301/boot-n2den/xc2.exe
cwd = xc2/build/301/boot-n2den
gfx = window
link = host
exefs = xc2/game/xc2ns301
romfs = xc2/build/301/game/romfs
dlc = xc2/build/301/game/dlc
save = work/save-xc2nh
shader_cache = xc2/build/301/shader_cache
missing = work/missing-xc2nh
logs = work/logs
fps = 60
hz = 60

[env]
NXRT_SYSTEM_LANGUAGE = en-US
NXRT_NVN_BACKEND = n2den
