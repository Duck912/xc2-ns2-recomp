name: Feature request
description: Something the emulator or the toolchain should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **If you are on an older build, update first.** Check [`0.2.5`](https://github.com/weile10000/xc2-ns2-recomp/releases/latest)
        or newer — recent updates already added M4 Mod Manager / DMNT Cheats, FSR 3 FG `HUDLessColor`, F10 dual FPS display, and runtime NVIDIA 3D stencil fixes.

        **报 issue 前请先确认版本是 0.2.5 或更新**，近期版本已补齐 M4 模组与作弊码界面、FSR 3 FG 去 UI 重影、F10 双帧率显示以及运行期 3D 黑条修复等。
  - type: textarea
    id: what
    attributes:
      label: What do you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is useful
      description: Who hits this, and what it costs them today.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you would do it (optional)
      description: Pointers into the code are welcome.
