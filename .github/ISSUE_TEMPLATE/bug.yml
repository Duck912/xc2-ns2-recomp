name: Bug report
description: Something is wrong with the emulator, a build step or a tool
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you open this: please read [docs/COMPATIBILITY.md](docs/COMPATIBILITY.md) —
        the known issues are listed there, and the three project invariants are in
        [docs/INVARIANTS.md](docs/INVARIANTS.md).
  - type: input
    id: build
    attributes:
      label: Build (optional)
      description: Release tag or commit you ran; the report zip carries it too.
  - type: input
    id: gpu
    attributes:
      label: GPU, driver and Windows version (optional)
      description: The report zip already records these; fill them in if you know them.
      placeholder: RX 6800 XT, Adrenalin 26.10.1, Windows 11 26200
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and where in the game.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report zip
      description: |
        For anything about what the game draws, use the launcher: **About -> Record a report**. It starts the game with the
        diagnostics on, and closing the window writes the zip. From a command prompt the same thing is:

        ```
        tools\python\python.exe tools\report.py
        ```

        Play until the problem shows, then close the game. It writes
        `work\reports\report-<timestamp>.zip`; attach that file. Add `-Headless` if you also want a
        frame-time CSV.

        The zip holds the validation layer's messages, the capability lines your driver reports, whether
        the device was lost, your settings and the full log. Nothing in it is game data.

        For a build-step or tooling bug, a log from `work\logs\` is enough.
      placeholder: report-20261117-165952.zip
    validations:
      required: true
  - type: dropdown
    id: upscaler
    attributes:
      label: Does it also happen with TAAU? (optional)
      description: Only if you feel like running it twice - set [dlss] upscaler = bilinear (or [upscale] mode = off for the spatial path), restart, and try the same spot.
      options:
        - "Not tried"
        - "Yes, it happens without it too"
        - "No, only with FSR / DLSS"
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This repository contains no game files, and I have not attached any.
          required: true
